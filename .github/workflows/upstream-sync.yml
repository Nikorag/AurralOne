name: Upstream sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: lklynet/aurral
  BRANCH: sync/upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "${BRANCH}" origin/main
          if git merge --no-edit upstream/main; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            {
              echo "state=conflict"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push to main
        if: steps.merge.outputs.state == 'clean'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error title=SYNC_TOKEN is not set::Pushes made with the default token do not trigger other workflows."
            exit 1
          fi
          git push origin "${BRANCH}:main"

      - name: Report conflicts
        if: steps.merge.outputs.state == 'conflict'
        env:
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          echo "::error title=Upstream sync has conflicts::${FILES//$'\n'/, }"
          echo "Resolve it locally: git fetch upstream, git switch -c sync/upstream origin/main, git merge upstream/main"
          exit 1
