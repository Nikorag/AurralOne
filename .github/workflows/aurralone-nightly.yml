name: AurralOne nightly

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurralone-nightly
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository != 'lklynet/aurral'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_VERSION=nightly.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:nightly
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GITHUB_REPO=${{ github.repository }}
            RELEASE_CHANNEL=nightly
          cache-from: type=gha,scope=aurralone-nightly
          cache-to: type=gha,mode=max,scope=aurralone-nightly
